<template>

    <!-- Generate Invoice Button -->
    <div class="slds-grid slds-grid_align-end slds-m-bottom_medium">
        <lightning-button
            label="Generate Invoice"
            variant="brand"
            icon-name="utility:moneybag"
            onclick={openModal}>
        </lightning-button>
    </div>

    <!-- ================= MODAL ================= -->
    <template if:true={showModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare"
                        class="slds-modal__close"
                        onclick={closeModal}>
                    </lightning-button-icon>
                    <h2 class="slds-text-heading_medium">Create Invoice</h2>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">

                    <!-- Dates -->
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input
                                type="date"
                                label="Invoice Date"
                                value={invoiceDate}
                                disabled>
                            </lightning-input>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input
                                type="date"
                                label="Due Date"
                                onchange={handleDueDateChange}>
                            </lightning-input>
                        </div>
                    </div>

                    <!-- Line Items -->
                    <lightning-card title="Invoice Line Items" class="slds-m-top_medium">
                        <div class="slds-p-around_medium">
              

                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr>
                                        <th>Fee Type</th>
                                        <th>Amount</th>
                                        <th>Description</th>
                                        <th>
                                            <lightning-button-icon
                                                icon-name="utility:add"
                                                variant="brand"
                                                onclick={addRow}>
                                            </lightning-button-icon>
                                        </th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <template for:each={lineItems} for:item="item" for:index="index">
                                        <tr key={item.key}>                                       

                                            <!-- PRODUCT LOOKUP -->
                                            <td>
                                             <lightning-record-picker
                                                    object-api-name="Product2"
                                                    value={item.productId}
                                                    data-index={index}
                                                    label="Fee Type"
                                                    onchange={handleProductChange}>
                                                </lightning-record-picker>
                                            </td>
                                        
                                            <!-- AMOUNT -->
                                            <td>
                                                <lightning-input
                                                    type="number"
                                                    value={item.amount}
                                                    label="Amount"
                                                    data-index={index}
                                                    data-field="amount"
                                                    onchange={handleRowChange}>
                                                </lightning-input>
                                            </td>

                                            <!-- DESCRIPTION -->
                                            <td>
                                                <lightning-input
                                                    value={item.description}
                                                    data-index={index}
                                                    label="Description"
                                                    data-field="description"
                                                    onchange={handleRowChange}>
                                                </lightning-input>
                                            </td>

                                            <!-- REMOVE -->
                                            <td class="slds-text-align_center">
                                                <lightning-button-icon
                                                    icon-name="utility:close"
                                                    data-index={index}
                                                    onclick={removeRow}>
                                                </lightning-button-icon>
                                            </td>

                                        </tr>
                                    </template>
                                </tbody>
                            </table>

                        </div>
                    </lightning-card>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Submit"
                        variant="brand"
                        onclick={submitForm}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
