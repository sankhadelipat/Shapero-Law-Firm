<template>

    <lightning-card variant="narrow" icon-name="standard:document">
        <h1 slot="title">Invoice Preview</h1>
        <div class="">
            <p>{message}</p>
            <iframe
                src={previewUrl}
                width="100%"
                height="550px">
            </iframe>
        </div>
        <div slot="footer">
            <lightning-button
                label="Cancel"
                onclick={handleCancel}>
            </lightning-button>

            <lightning-button
                variant="brand"
                label="Send"
                onclick={handleSend}>
            </lightning-button>
        </div>
    </lightning-card>
    
    
</template>
